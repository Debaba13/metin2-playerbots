{% extends 'base.html' %}{% block title %}İlk Kurulum · Metin2 Singleplayer{% endblock %}{% block content %}
<section class="setup-card panel"><p class="eyebrow">İLK ÇALIŞTIRMA</p><h1>Paneli Yapılandırın</h1><p class="muted">Bu ayarlar daha sonra Yönetim'den değiştirilebilir.</p><form method="post" class="manage-form settings-form"><label>Panel Adı <input name="panel_name" maxlength="48" value="Metin2 Singleplayer" required></label><label>Hareketsizlik Alarmı <input name="stuck_minutes" type="number" min="1" max="120" value="5" required><small>dakika</small></label><label>Renk Teması <select name="theme"><option value="ocean">Ocean</option><option value="ember">Ember</option><option value="forest">Forest</option></select></label><label>İzleme Kaynağı <select name="monitor_mode"><option value="vps">VPS / host</option><option value="docker">Docker / yerel</option></select></label><label class="checkbox-row"><span>Şifre Koruması</span><input id="enable-auth" type="checkbox" name="auth_enabled" value="1"><small>isteğe bağlı</small></label><label id="setup-password" hidden>Panel Şifresi <input name="panel_password" type="password" minlength="8" autocomplete="new-password" placeholder="en az 8 karakter"><small>isteğe bağlı</small></label><button>Kaydet ve Paneli Aç</button></form></section><script>const check=document.getElementById('enable-auth'),password=document.getElementById('setup-password');check.addEventListener('change',()=>password.hidden=!check.checked);</script>{% endblock %}
